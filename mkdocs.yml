site_name: json2vec
site_url: https://json2vec.github.io/json2vec/
repo_url: https://github.com/json2vec/json2vec
extra:
  generator: false
  discord_url: https://discord.gg/DVyZUkvTFA
theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
extra_css:
  - assets/stylesheets/docs.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include: ["*.ipynb"]
      include_source: true
      no_prompt: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            filters:
              - "!^_"
            merge_init_into_class: true
            members_order: source
            separate_signature: true
            show_if_no_docstring: true
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
nav:
  - Home: index.md
  - Motivation: motivation.md
  - Getting Started: getting-started.md
  - AI / Expert Quickstart: ai-quickstart.md
  - Core Concepts:
      - Model Tree: core-concepts/model-tree.md
      - Query Paths: core-concepts/querypaths.md
      - Data Types: core-concepts/data-types.md
      - Learning Modes & Embeddings: core-concepts/embeddings.md
      - Mutations: core-concepts/mutations.ipynb
  - Data Types:
      - Array: data-types/array.md
      - Number: data-types/number.md
      - Category: data-types/category.md
      - Set: data-types/set.md
      - DateParts: data-types/dateparts.md
      - Entity: data-types/entity.md
      - Vector: data-types/vector.md
      - Text: data-types/text.md
      - Custom Data Types: data-types/tensorfields.ipynb
  - Tutorials:
      - Hello World: tutorials/hello-world.ipynb
      - Supervised Tabular Training: tutorials/supervised-tabular-training.ipynb
      - Masked Pretraining: tutorials/pretraining.ipynb
      - Nested Supervised Training: tutorials/nested-supervised-training.ipynb
      - Serving: tutorials/serving.ipynb
  - Guides:
      - Training With Lightning: guides/lightning.md
      - Data Modules: guides/data-modules.md
      - Batch Inference: guides/batch-inference.md
      - Field Importance: guides/field-importance.ipynb
      - Preprocessors: guides/preprocessors.ipynb
      - Postprocessors: guides/postprocessors.md
      - Field Stacking: guides/field-stacking.md
  - Case Studies:
      - Device Tenure: case-studies/device-tenure.md
  - Reference:
      - API: reference/api.md
