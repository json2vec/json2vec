{# Keep docs color mode tied to prefers-color-scheme without rendering a toggle. #}
<script>
  (function () {
    var media = matchMedia("(prefers-color-scheme: dark)")
    var apply = function () {
      document.body.setAttribute("data-md-color-scheme", media.matches ? "slate" : "default")
      document.body.setAttribute("data-md-color-primary", "teal")
      document.body.setAttribute("data-md-color-accent", "deep-orange")

      try {
        localStorage.removeItem(__md_scope.pathname + ".__palette")
      } catch (error) {}
    }

    apply()

    if (typeof media.addEventListener === "function") {
      media.addEventListener("change", apply)
    } else if (typeof media.addListener === "function") {
      media.addListener(apply)
    }
  })()
</script>
