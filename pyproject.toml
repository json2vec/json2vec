[project]
name = "relflow"
version = "0.1.4"
description = "Relationship Flow: schema-first PyTorch models for hierarchical, nested, and sequence data"
readme = "README.md"
authors = [
    { name = "Grantham Taylor" },
    { name = "Reid Taylor" },
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.21.0",
    "rich>=14.0.0",
    "pydantic>=2.11.7",
    "anytree>=2.13.0",
    "pyarrow>=21.0.0",
    "numpy>=2.2.6",
    "lightning>=2.6.4",
    "tensordict>=0.10.0",
    "torch>=2.7.1",
    "torchmetrics>=1.9.0",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.124.0",
    "orjson>=3.10.0",
    "pydantic-settings>=2.10.1",
    "uvicorn>=0.38.0",
]
text = [
    "transformers>=4.55.0",
]
hash = [
    "polars>=1.35.2",
]
docs = [
    "marimo>=0.23.8",
    "polars>=1.35.2",
]

[dependency-groups]
dev = [
    "ruff>=0.12.12",
    "pytest>=8.4.1",
    "pytest-xdist>=3.8.0",
    "ipython>=9.9.0",
    "ipykernel>=6.29.5",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "fastapi>=0.124.0",
    "orjson>=3.10.0",
    "pydantic-settings>=2.10.1",
    "uvicorn>=0.38.0",
    "ty>=0.0.1a20",
    "pre-commit>=4.3.0",
    "polars>=1.35.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["relflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-n", "auto"]

[tool.ruff]
line-length = 120
lint.extend-select = ["I"]

[tool.ty.rules]
# Keep ty as a green baseline while the dynamic extension/Torch/Lightning surfaces
# are covered by runtime tests and can be tightened incrementally.
unresolved-attribute = "ignore"
invalid-type-form = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unknown-argument = "ignore"
invalid-method-override = "ignore"
call-non-callable = "ignore"
invalid-return-type = "ignore"
not-subscriptable = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"
invalid-attribute-override = "ignore"
redundant-cast = "ignore"
unused-ignore-comment = "ignore"
